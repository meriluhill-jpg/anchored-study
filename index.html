              "What does 'satisfied' look like for you — not just with food, but in life? What are you actually longing for at the deepest level?",
              "Over these 7 weeks, what is the most important thing God has shown you about yourself?"
            ]
          },
          {
            day: 5,
            label: "Looking Forward",
            focus: "Carrying it forward",
            content: "The work doesn't stop at week 7 — but you're building something real.",
            questions: [
              "What one practice from these seven weeks do you want to carry forward permanently?",
              "What does a healthy relationship with food — not perfect, but peaceful — look like for you practically?"
            ]
          },
          {
            day: 6,
            label: "Practice",
            focus: "The Freedom Vision",
            content: "Vision is a spiritual practice. Where there is no vision, the people perish.",
            task: "Write your 'Freedom Vision' — one paragraph describing what this area of your life looks like in one year if you keep doing the work. Not perfect — free. Read it every Sunday morning for the next month.",
            questions: [
              "Write your Freedom Vision here. What does one year from now look like?"
            ]
          },
          {
            day: 7,
            label: "Pray & Rest",
            focus: "Final prayer & celebration",
            content: "You showed up. Seven weeks. That matters. Finish well.",
            prayer: "Jesus, You are the bread of life. When I've been reaching for food to cope, I've often been reaching for something You were always offering. Teach me to come to You first — when I'm stressed, lonely, overwhelmed, or just bored. Fill me with good things. Let me be genuinely satisfied. I'm not done yet — but I'm not where I was. Thank You. Amen.",
            questions: [
              "Who or what are you becoming through this process? Write a short reflection on where you started and where you are now."
            ]
          }
        ]
      }
    ];

    function BibleStudy() {
      const [activeWeek, setActiveWeek] = useState(0);
      const [activeDay, setActiveDay] = useState(0);
      const [answers, setAnswers] = useState(() => {
        try { return JSON.parse(localStorage.getItem("anchored_answers") || "{}"); } catch { return {}; }
      });
      const [completedDays, setCompletedDays] = useState(() => {
        try { return JSON.parse(localStorage.getItem("anchored_completed") || "[]"); } catch { return []; }
      });

      const week = study[activeWeek];
      const day = week.days[activeDay];
      const dayKey = `w${activeWeek}d${activeDay}`;

      const saveAnswer = (qIdx, val) => {
        const key = `${dayKey}_q${qIdx}`;
        const updated = { ...answers, [key]: val };
        setAnswers(updated);
        localStorage.setItem("anchored_answers", JSON.stringify(updated));
      };

      const getAnswer = (qIdx) => answers[`${dayKey}_q${qIdx}`] || "";

      const markDayComplete = () => {
        const key = dayKey;
        if (!completedDays.includes(key)) {
          const updated = [...completedDays, key];
          setCompletedDays(updated);
          localStorage.setItem("anchored_completed", JSON.stringify(updated));
        }
        if (activeDay < week.days.length - 1) {
          setActiveDay(activeDay + 1);
          window.scrollTo(0, 0);
        } else if (activeWeek < study.length - 1) {
          setActiveWeek(activeWeek + 1);
          setActiveDay(0);
          window.scrollTo(0, 0);
        }
      };

      const isDayComplete = (w, d) => completedDays.includes(`w${w}d${d}`);
      const weeksCompleted = study.filter((_, wi) => study[wi].days.every((_, di) => isDayComplete(wi, di))).length;
      const totalDays = study.reduce((a, w) => a + w.days.length, 0);
      const completedCount = completedDays.length;

      return (
        <div style={{ minHeight: "100vh", background: "#1a1410" }}>
          {/* Header */}
          <div style={{ background: "linear-gradient(135deg, #2a1f14, #1a1410)", borderBottom: "1px solid #3a2d20", padding: "24px 20px 18px", textAlign: "center" }}>
            <div style={{ fontSize: 10, letterSpacing: "0.3em", color: "#a08060", textTransform: "uppercase", marginBottom: 6 }}>A 7-Week Bible Study</div>
            <h1 style={{ fontSize: 24, fontWeight: "normal", color: "#f0e4d0", margin: "0 0 4px" }}>Anchored in the Storm</h1>
            <div style={{ fontSize: 13, color: "#9a8060", fontStyle: "italic" }}>Self-Control, Emotions &amp; Food</div>
            <div style={{ marginTop: 12, fontSize: 12, color: "#6a5a48" }}>{completedCount} of {totalDays} days complete</div>
            <div style={{ background: "#2a2018", borderRadius: 3, height: 3, margin: "6px auto 0", maxWidth: 200, overflow: "hidden" }}>
              <div style={{ width: `${(completedCount / totalDays) * 100}%`, height: "100%", background: week.color, transition: "width 0.4s" }} />
            </div>
          </div>

          {/* Week Tabs */}
          <div style={{ display: "flex", overflowX: "auto", gap: 6, padding: "12px 14px 0" }}>
            {study.map((w, wi) => {
              const wComplete = w.days.every((_, di) => isDayComplete(wi, di));
              return (
                <button key={wi} onClick={() => { setActiveWeek(wi); setActiveDay(0); window.scrollTo(0,0); }}
                  style={{ flexShrink: 0, background: activeWeek === wi ? w.color : "transparent", border: `1px solid ${activeWeek === wi ? w.color : "#3a2d20"}`, borderRadius: 8, padding: "6px 12px", cursor: "pointer", position: "relative" }}>
                  <div style={{ fontSize: 9, color: activeWeek === wi ? "rgba(255,255,255,0.65)" : "#6a5a48", letterSpacing: "0.1em" }}>WK</div>
                  <div style={{ fontSize: 15, fontWeight: "bold", color: activeWeek === wi ? "#fff" : "#8a7060" }}>{wi + 1}</div>
                  {wComplete && <div style={{ position: "absolute", top: 3, right: 5, fontSize: 8, color: "#7fc87f" }}>✓</div>}
                </button>
              );
            })}
          </div>

          {/* Day Tabs */}
          <div style={{ display: "flex", gap: 5, padding: "10px 14px 0", overflowX: "auto" }}>
            {week.days.map((d, di) => {
              const done = isDayComplete(activeWeek, di);
              const active = activeDay === di;
              return (
                <button key={di} onClick={() => { setActiveDay(di); window.scrollTo(0,0); }}
                  style={{ flexShrink: 0, background: active ? `${week.color}cc` : done ? `${week.color}33` : "#1e1812", border: `1px solid ${active ? week.color : done ? week.color + "55" : "#2e2418"}`, borderRadius: 20, padding: "5px 12px", cursor: "pointer", fontSize: 12, color: active ? "#fff" : done ? "#a0c890" : "#6a5a48", display: "flex", alignItems: "center", gap: 5 }}>
                  {done && !active && <span style={{ fontSize: 9 }}>✓</span>}
                  Day {di + 1}
                </button>
              );
            })}
          </div>

          {/* Day Content */}
          <div style={{ padding: "14px 16px 28px" }}>
            {/* Day Header */}
            <div style={{ background: `linear-gradient(135deg, ${week.color}20, ${week.color}08)`, border: `1px solid ${week.color}40`, borderRadius: 12, padding: "18px 18px 14px", marginBottom: 14 }}>
              <div style={{ fontSize: 10, color: "#a08060", letterSpacing: "0.2em", textTransform: "uppercase", marginBottom: 3 }}>
                Week {activeWeek + 1} · Day {activeDay + 1} · {day.label}
              </div>
              <div style={{ fontSize: 18, color: "#f0e4d0", marginBottom: 10, lineHeight: 1.3 }}>
                {week.icon} {day.focus}
              </div>
              <p style={{ fontSize: 15, color: "#c0a888", lineHeight: 1.75, margin: 0 }}>{day.content}</p>
            </div>

            {/* Scripture */}
            {day.scripture && (
              <div style={{ background: "#1e1610", border: `1px solid ${week.color}33`, borderLeft: `3px solid ${week.color}`, borderRadius: "0 10px 10px 0", padding: "14px 16px", marginBottom: 14 }}>
                <div style={{ fontSize: 11, color: "#a08060", letterSpacing: "0.15em", textTransform: "uppercase", marginBottom: 8 }}>{day.scripture.ref}</div>
                <div style={{ fontSize: 15, color: "#e0d0b8", lineHeight: 1.85, fontStyle: "italic", marginBottom: 8 }}>"{day.scripture.text}"</div>
                {day.note && <div style={{ fontSize: 13, color: "#9a8060" }}>→ {day.note}</div>}
              </div>
            )}

            {/* Task */}
            {day.task && (
              <div style={{ background: `${week.color}15`, border: `1px solid ${week.color}30`, borderRadius: 10, padding: "14px 16px", marginBottom: 14 }}>
                <div style={{ fontSize: 11, color: week.color, letterSpacing: "0.15em", textTransform: "uppercase", marginBottom: 8 }}>Today's Practice</div>
                <div style={{ fontSize: 15, color: "#d0c0a0", lineHeight: 1.75 }}>{day.task}</div>
              </div>
            )}

            {/* Prayer */}
            {day.prayer && (
              <div style={{ background: "#1e1610", border: `1px solid ${week.color}33`, borderRadius: 10, padding: "16px", marginBottom: 14 }}>
                <div style={{ fontSize: 11, color: "#a08060", letterSpacing: "0.15em", textTransform: "uppercase", marginBottom: 10 }}>🙏 Prayer</div>
                <p style={{ fontSize: 15, color: "#d8c8a8", lineHeight: 1.9, fontStyle: "italic", margin: 0 }}>{day.prayer}</p>
              </div>
            )}

            {/* Questions */}
            {day.questions && (
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 11, color: "#a08060", letterSpacing: "0.15em", textTransform: "uppercase", marginBottom: 12 }}>💭 Reflection Questions</div>
                {day.questions.map((q, qi) => (
                  <div key={qi} style={{ marginBottom: 16 }}>
                    <div style={{ display: "flex", gap: 10, marginBottom: 8 }}>
                      <div style={{ flexShrink: 0, width: 22, height: 22, background: `${week.color}33`, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, color: week.color, marginTop: 2 }}>{qi + 1}</div>
                      <div style={{ fontSize: 15, color: "#c8b898", lineHeight: 1.7 }}>{q}</div>
                    </div>
                    <textarea
                      value={getAnswer(qi)}
                      onChange={e => saveAnswer(qi, e.target.value)}
                      placeholder="Write your thoughts here... (auto-saved)"
                      rows={4}
                      style={{
                        width: "100%",
                        background: "#211810",
                        border: `1px solid ${getAnswer(qi) ? week.color + "55" : "#3a2d20"}`,
                        borderRadius: 8,
                        padding: "12px 14px",
                        fontSize: 14,
                        color: "#d0c0a0",
                        lineHeight: 1.7,
                        outline: "none",
                      }}
                    />
                  </div>
                ))}
              </div>
            )}

            {/* Complete Button */}
            <button onClick={markDayComplete}
              style={{
                width: "100%",
                background: isDayComplete(activeWeek, activeDay) ? `${week.color}55` : week.color,
                border: `1px solid ${week.color}`,
                borderRadius: 10,
                padding: "14px",
                fontSize: 15,
                color: "#fff",
                letterSpacing: "0.04em",
              }}>
              {isDayComplete(activeWeek, activeDay)
                ? "✓ Day Complete"
                : activeDay < week.days.length - 1
                ? `Complete Day ${activeDay + 1} → Day ${activeDay + 2}`
                : activeWeek < study.length - 1
                ? `Complete Week ${activeWeek + 1} → Week ${activeWeek + 2}`
                : "✓ Complete the Study"}
            </button>

            <div style={{ textAlign: "center", fontSize: 12, color: "#4a3a28", fontStyle: "italic", paddingTop: 20, lineHeight: 1.7 }}>
              "Though I have fallen, I will rise." — Micah 7:8
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<BibleStudy />);
  </script>
</body>
</html>
